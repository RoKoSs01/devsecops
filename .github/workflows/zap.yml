name: DevSecOps Pipeline (SAST + Secrets + DAST + Docker Security + Multi-arch)

on:
  push:
    branches: [master]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      packages: write
      actions: read

    env:
      DAST_IMAGE: devsecops-demo:dast
      DAST_TARGET: http://app-under-test:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==================== SECRET SCANNING - Gitleaks ====================
      - name: Detect hardcoded secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # ==================== SAST - CodeQL ====================
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # ==================== DOCKER IMAGE FOR DAST ====================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Docker image for DAST
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.DAST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==================== DAST - OWASP ZAP BASELINE ====================
      - name: Start application container for DAST
        shell: bash
        run: |
          docker network create dast-net

          docker run -d \
            --name app-under-test \
            --network dast-net \
            "${DAST_IMAGE}"

          docker pull ghcr.io/zaproxy/zaproxy:stable

          for attempt in {1..30}; do
            if docker run --rm \
              --network dast-net \
              ghcr.io/zaproxy/zaproxy:stable \
              curl -fsS "${DAST_TARGET}/" > /dev/null; then
              echo "Application is ready for DAST"
              exit 0
            fi

            echo "Waiting for application startup: attempt ${attempt}/30"
            sleep 2
          done

          echo "Application did not become available"
          docker logs app-under-test
          exit 1

      - name: Run OWASP ZAP Baseline scan
        id: zap_scan
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p zap-report

          docker run --rm \
            --network dast-net \
            -v "${GITHUB_WORKSPACE}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "${DAST_TARGET}/" \
              -c .zap/baseline.conf \
              -I \
              -r zap-report/zap-baseline.html \
              -J zap-report/zap-baseline.json \
              -w zap-report/zap-baseline.md

      - name: Capture container logs and stop DAST target
        if: always()
        shell: bash
        run: |
          mkdir -p zap-report
          docker logs app-under-test > zap-report/application.log 2>&1 || true
          docker rm -f app-under-test || true
          docker network rm dast-net || true

      - name: Upload ZAP DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap-report/
          retention-days: 14

      - name: Enforce DAST security gate
        if: steps.zap_scan.outcome == 'failure'
        run: |
          echo "DAST security gate failed. Docker image will not be published."
          exit 1

      # ==================== DOCKER BUILD & PUSH MULTI-ARCH ====================
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/rokoss01/devsecops-demo:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max